```yaml
name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend to AWS Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e

            cd /var/www/searchprop-backend

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            npm ci --omit=dev

            if pm2 describe searchprop-backend > /dev/null 2>&1; then
              pm2 restart searchprop-backend --update-env
            else
              pm2 start server.js --name searchprop-backend
            fi

            pm2 save
```
